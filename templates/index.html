<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Hosting Pro - Управление услугами</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

        /* Header */
        header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(100, 116, 139, 0.3);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-nav {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .balance-card {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 500;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3); }
        .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #475569; }
        .btn-ghost:hover { background: rgba(100, 116, 139, 0.2); color: #e2e8f0; }
        .btn-danger { background: rgba(239, 68, 68, 0.2); color: #ff7b7b; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-danger:hover { background: rgba(239, 68, 68, 0.3); }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
            margin-top: 30px;
        }

        /* Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .sidebar-item {
            padding: 14px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-item:hover {
            background: rgba(100, 116, 139, 0.2);
            color: #e2e8f0;
        }
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(6, 182, 212, 0.2) 0%, rgba(59, 130, 246, 0.2) 100%);
            border-left-color: #06b6d4;
            color: #e2e8f0;
        }
        .sidebar-item i { width: 20px; }

        /* Cards */
        .card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.5) 100%);
            border: 1px solid rgba(100, 116, 139, 0.2);
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s;
        }
        .card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .service-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.6) 0%, rgba(15, 23, 42, 0.6) 100%);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #06b6d4 0%, #3b82f6 100%);
        }
        .service-card:hover {
            transform: translateY(-4px);
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 20px 40px rgba(6, 182, 212, 0.1);
        }
        .service-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #f1f5f9;
        }
        .service-type {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 12px;
        }
        .service-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 12px;
        }
        .info-item {
            background: rgba(100, 116, 139, 0.1);
            padding: 8px;
            border-radius: 6px;
            border-left: 2px solid #06b6d4;
        }
        .info-label { color: #94a3b8; }
        .info-value { color: #f1f5f9; font-weight: 500; margin-top: 2px; }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .status-active { background: rgba(34, 197, 94, 0.2); color: #86efac; }
        .status-pending { background: rgba(202, 138, 4, 0.2); color: #fbbf24; }
        .status-expired { background: rgba(239, 68, 68, 0.2); color: #ff7b7b; }
        .status-expiring { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }

        /* Buttons in Card */
        .service-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .service-actions .btn {
            padding: 8px 12px;
            font-size: 12px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #1e293b;
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .modal-header {
            padding: 24px;
            border-bottom: 1px solid rgba(100, 116, 139, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 { margin: 0; }
        .modal-close {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 24px;
        }
        .modal-close:hover { color: #e2e8f0; }
        .modal-body { padding: 24px; }
        .modal-footer {
            padding: 24px;
            border-top: 1px solid rgba(100, 116, 139, 0.2);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }
        input[type="text"],
        input[type="email"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px 14px;
            background: rgba(100, 116, 139, 0.1);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #06b6d4;
            background: rgba(100, 116, 139, 0.15);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }

        /* Tickets */
        .ticket-item {
            background: rgba(100, 116, 139, 0.1);
            border: 1px solid rgba(100, 116, 139, 0.2);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .ticket-item:hover {
            background: rgba(100, 116, 139, 0.15);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .ticket-title { font-weight: 600; margin-bottom: 4px; }
        .ticket-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            margin-top: 8px;
        }
        .ticket-priority {
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .priority-high { background: rgba(239, 68, 68, 0.2); color: #ff7b7b; }
        .priority-medium { background: rgba(202, 138, 4, 0.2); color: #fbbf24; }
        .priority-low { background: rgba(59, 130, 246, 0.2); color: #60a5fa; }

        /* Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 400px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(100, 116, 139, 0.05);
            border-radius: 8px;
        }
        .message {
            margin-bottom: 12px;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message-user {
            text-align: right;
            margin-bottom: 12px;
        }
        .message-content {
            display: inline-block;
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
        }
        .message-user .message-content {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
        }
        .message-admin .message-content {
            background: rgba(100, 116, 139, 0.2);
            color: #cbd5e1;
        }
        .message-time {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
        }
        .chat-input-group {
            display: flex;
            gap: 8px;
        }
        .chat-input-group input {
            flex: 1;
            padding: 10px 14px;
            background: rgba(100, 116, 139, 0.1);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
        }
        .chat-input-group .btn {
            padding: 10px 16px;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94a3b8;
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
        .empty-state h3 { font-size: 18px; margin-bottom: 8px; }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content { grid-template-columns: 1fr; }
            .sidebar { flex-direction: row; gap: 8px; overflow-x: auto; }
            .services-grid { grid-template-columns: 1fr; }
            .service-info { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">
                <i class="fas fa-cloud"></i> Cloud Pro
            </div>
            <div class="header-nav">
                <div class="balance-card">
                    <i class="fas fa-wallet"></i> <span id="balance">€0.00</span>
                </div>
                <button class="btn btn-primary" onclick="openTopUpModal()">
                    <i class="fas fa-plus"></i> Пополнить
                </button>
                <button class="btn btn-ghost" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-item active" onclick="switchSection('dashboard')">
                    <i class="fas fa-home"></i> Панель
                </div>
                <div class="sidebar-item" onclick="switchSection('services')">
                    <i class="fas fa-server"></i> Услуги
                </div>
                <div class="sidebar-item" onclick="switchSection('tickets')">
                    <i class="fas fa-headset"></i> Поддержка
                </div>
                <div class="sidebar-item" onclick="switchSection('settings')">
                    <i class="fas fa-sliders-h"></i> Настройки
                </div>
            </div>

            <div id="content"></div>
        </div>
    </div>

    <!-- Top Up Modal -->
    <div id="topupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Пополнить баланс</h2>
                <button class="modal-close" onclick="closeModal('topupModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Сумма пополнения (€)</label>
                    <input type="number" id="topupAmount" placeholder="50" min="1" step="0.01">
                </div>
                <div class="form-group">
                    <label>Способ оплаты</label>
                    <select id="paymentMethod">
                        <option value="card">Карта</option>
                        <option value="crypto">Криптовалюта</option>
                        <option value="bank">Банковский перевод</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-ghost" onclick="closeModal('topupModal')">Отмена</button>
                <button class="btn btn-primary" onclick="submitTopUp()">Пополнить</button>
            </div>
        </div>
    </div>

    <!-- Create Service Modal -->
    <div id="serviceModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Новая услуга</h2>
                <button class="modal-close" onclick="closeModal('serviceModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div id="serviceModalContent"></div>
            </div>
        </div>
    </div>

    <!-- Ticket Modal -->
    <div id="ticketModal" class="modal">
        <div class="modal-content" style="max-width: 700px;">
            <div class="modal-header">
                <h2 id="ticketTitle">Тикет</h2>
                <button class="modal-close" onclick="closeModal('ticketModal')">&times;</button>
            </div>
            <div class="modal-body">
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages"></div>
                    <div class="chat-input-group">
                        <input type="text" id="chatInput" placeholder="Ваше сообщение..." />
                        <button class="btn btn-primary" onclick="sendMessage()" style="padding: 10px 16px;">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('authToken');
        let currentSection = 'dashboard';
        let currentTicketId = null;
        const API = 'http://localhost:8000/api';

        // Auth check
        if (!authToken) {
            window.location.href = '/login';
        }

        function apiCall(endpoint, method = 'GET', body = null) {
            const options = {
                method,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${authToken}`
                }
            };
            if (body) options.body = JSON.stringify(body);

            return fetch(`${API}${endpoint}`, options).then(r => {
                if (r.status === 401) {
                    localStorage.removeItem('authToken');
                    window.location.href = '/login';
                }
                return r.json().catch(() => ({}));
            });
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = '/login';
        }

        function switchSection(section) {
            currentSection = section;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            event.target.closest('.sidebar-item').classList.add('active');

            if (section === 'dashboard') renderDashboard();
            else if (section === 'services') renderServices();
            else if (section === 'tickets') renderTickets();
            else if (section === 'settings') renderSettings();
        }

        function renderDashboard() {
            apiCall('/user').then(user => {
                apiCall('/services').then(services => {
                    const active = services.filter(s => s.status === 'active').length;
                    const pending = services.filter(s => s.status === 'pending').length;
                    const expiring = services.filter(s => s.status === 'expiring_soon').length;

                    document.getElementById('content').innerHTML = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px;">
                            <div class="card">
                                <div style="font-size: 32px; margin-bottom: 8px;">💰</div>
                                <div style="color: #94a3b8; font-size: 12px;">Баланс</div>
                                <div style="font-size: 24px; font-weight: 700; margin-top: 8px;">€${user.balance.toFixed(2)}</div>
                            </div>
                            <div class="card">
                                <div style="font-size: 32px; margin-bottom: 8px;">✅</div>
                                <div style="color: #94a3b8; font-size: 12px;">Активных услуг</div>
                                <div style="font-size: 24px; font-weight: 700; margin-top: 8px;">${active}</div>
                            </div>
                            <div class="card">
                                <div style="font-size: 32px; margin-bottom: 8px;">⏳</div>
                                <div style="color: #94a3b8; font-size: 12px;">На активации</div>
                                <div style="font-size: 24px; font-weight: 700; margin-top: 8px;">${pending}</div>
                            </div>
                            <div class="card">
                                <div style="font-size: 32px; margin-bottom: 8px;">⚠️</div>
                                <div style="color: #94a3b8; font-size: 12px;">Скоро истечёт</div>
                                <div style="font-size: 24px; font-weight: 700; margin-top: 8px;">${expiring}</div>
                            </div>
                        </div>
                        <div class="card" style="margin-top: 20px;">
                            <h3 style="margin-bottom: 16px;">Последние услуги</h3>
                            ${services.slice(0, 3).map(s => `
                                <div class="ticket-item" onclick="viewService(${s.id})">
                                    <div style="display: flex; justify-content: space-between; align-items: center;">
                                        <div>
                                            <div style="font-weight: 600;">${s.name}</div>
                                            <div style="color: #94a3b8; font-size: 12px;">${s.service_type} - ${s.plan}</div>
                                        </div>
                                        <span class="status-badge status-${s.status}">${getStatusText(s.status)}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    updateBalance();
                });
            });
        }

        function renderServices() {
            document.getElementById('content').innerHTML = `
                <div>
                    <div style="margin-bottom: 20px;">
                        <h2 style="margin-bottom: 16px;">Мои услуги</h2>
                        <button class="btn btn-primary" onclick="openServiceModal()">
                            <i class="fas fa-plus"></i> Заказать услугу
                        </button>
                    </div>
                    <div id="servicesContainer"></div>
                </div>
            `;

            apiCall('/services').then(services => {
                const html = services.length ? `
                    <div class="services-grid">
                        ${services.map(s => `
                            <div class="service-card" onclick="viewService(${s.id})">
                                <span class="status-badge status-${s.status}">${getStatusText(s.status)}</span>
                                <div class="service-name">${s.name}</div>
                                <div class="service-type">${s.service_type}</div>
                                <div class="service-info">
                                    <div class="info-item">
                                        <div class="info-label">План</div>
                                        <div class="info-value">${s.plan}</div>
                                    </div>
                                    <div class="info-item">
                                        <div class="info-label">Процессор</div>
                                        <div class="info-value">${s.cpu.substring(0, 15)}...</div>
                                    </div>
                                    <div class="info-item">
                                        <div class="info-label">Память</div>
                                        <div class="info-value">${s.ram}</div>
                                    </div>
                                    <div class="info-item">
                                        <div class="info-label">Диск</div>
                                        <div class="info-value">${s.disk}</div>
                                    </div>
                                </div>
                                ${s.days_left !== undefined ? `<div style="color: #94a3b8; font-size: 12px;">Осталось: ${s.days_left} дней</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                ` : '<div class="empty-state"><i class="fas fa-inbox"></i><h3>Услуг нет</h3><p>Заказать первую услугу</p></div>';
                document.getElementById('servicesContainer').innerHTML = html;
            });
        }

        function renderTickets() {
            document.getElementById('content').innerHTML = `
                <div>
                    <div style="margin-bottom: 20px;">
                        <h2 style="margin-bottom: 16px;">Техподдержка</h2>
                        <button class="btn btn-primary" onclick="openNewTicketModal()">
                            <i class="fas fa-plus"></i> Новый тикет
                        </button>
                    </div>
                    <div id="ticketsContainer"></div>
                </div>
            `;

            apiCall('/tickets').then(tickets => {
                const html = tickets.length ? tickets.map(t => `
                    <div class="ticket-item" onclick="openTicket(${t.id}, '${t.subject}')">
                        <div style="display: flex; justify-content: space-between; align-items: start;">
                            <div style="flex: 1;">
                                <div class="ticket-title">${t.subject}</div>
                                <div style="color: #94a3b8; font-size: 13px; margin-top: 4px;">
                                    ${t.message_count || 0} сообщений
                                </div>
                            </div>
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <span class="ticket-priority priority-${t.priority}">${t.priority}</span>
                                <span class="status-badge" style="margin-bottom: 0;">${t.status === 'open' ? '🟢 Открыт' : '🔴 Закрыт'}</span>
                            </div>
                        </div>
                    </div>
                `).join('') : '<div class="empty-state"><i class="fas fa-comments"></i><h3>Нет тикетов</h3><p>Создайте новый для связи с поддержкой</p></div>';
                document.getElementById('ticketsContainer').innerHTML = html;
            });
        }

        function renderSettings() {
            document.getElementById('content').innerHTML = `
                <div class="card" style="max-width: 500px;">
                    <h2 style="margin-bottom: 20px;">Настройки аккаунта</h2>
                    <p style="color: #94a3b8; margin-bottom: 30px;">Функциональность будет добавлена позже</p>
                </div>
            `;
        }

        function getStatusText(status) {
            const texts = {
                'active': '✅ Активна',
                'pending': '⏳ Активация',
                'expiring_soon': '⚠️ Скоро истечёт',
                'expired': '❌ Истекла'
            };
            return texts[status] || status;
        }

        function updateBalance() {
            apiCall('/balance').then(data => {
                document.getElementById('balance').textContent = '€' + data.balance.toFixed(2);
            });
        }

        function openTopUpModal() {
            document.getElementById('topupModal').classList.add('active');
        }

        function submitTopUp() {
            const amount = parseFloat(document.getElementById('topupAmount').value);
            if (!amount || amount <= 0) {
                alert('Введите корректную сумму');
                return;
            }

            apiCall('/balance/topup', 'POST', { amount }).then(data => {
                alert('Баланс пополнен!');
                closeModal('topupModal');
                updateBalance();
                renderDashboard();
            });
        }

        function openServiceModal() {
            document.getElementById('serviceModal').classList.add('active');
            document.getElementById('serviceModalContent').innerHTML = `
                <p style="color: #94a3b8;">Выберите тип услуги из панели навигации или через быстрые кнопки ниже</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px;">
                    <button class="btn btn-primary" style="padding: 12px;" onclick="createQuickService('VPS', 'PROMO-1')">
                        <i class="fas fa-server"></i> VPS
                    </button>
                    <button class="btn btn-primary" style="padding: 12px;" onclick="createQuickService('Dedicated', 'DED-1')">
                        <i class="fas fa-hdd"></i> Dedicated
                    </button>
                </div>
            `;
        }

        function openNewTicketModal() {
            const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.id = 'newTicketModal';
            modal.innerHTML = `
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Новый тикет</h2>
                        <button class="modal-close" onclick="document.getElementById('newTicketModal').remove()">&times;</button>
                    </div>
                    <div class="modal-body">
                        <div class="form-group">
                            <label>Тема</label>
                            <input type="text" id="ticketSubject" placeholder="Описание проблемы...">
                        </div>
                        <div class="form-group">
                            <label>Сообщение</label>
                            <textarea id="ticketMessage" rows="4" placeholder="Подробное описание..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Приоритет</label>
                            <select id="ticketPriority">
                                <option value="low">Низкий</option>
                                <option value="medium" selected>Средний</option>
                                <option value="high">Высокий</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button class="btn btn-ghost" onclick="document.getElementById('newTicketModal').remove()">Отмена</button>
                        <button class="btn btn-primary" onclick="createTicket()">Создать</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function createTicket() {
            const subject = document.getElementById('ticketSubject').value;
            const message = document.getElementById('ticketMessage').value;
            const priority = document.getElementById('ticketPriority').value;

            if (!subject || !message) {
                alert('Заполните все поля');
                return;
            }

            apiCall('/tickets', 'POST', { subject, message, priority }).then(data => {
                if (data.success) {
                    alert('Тикет создан!');
                    document.getElementById('newTicketModal').remove();
                    renderTickets();
                }
            });
        }

        function openTicket(ticketId, subject) {
            currentTicketId = ticketId;
            document.getElementById('ticketTitle').textContent = subject;
            document.getElementById('ticketModal').classList.add('active');
            loadTicketMessages();
        }

        function loadTicketMessages() {
            apiCall(`/tickets/${currentTicketId}`).then(data => {
                const messages = data.messages || [];
                document.getElementById('chatMessages').innerHTML = messages.map(m => `
                    <div class="message ${m.sender === 'admin' ? 'message-admin' : 'message-user'}">
                        <div class="message-content">${m.message}</div>
                        <div class="message-time">${m.sender}${m.sender === 'admin' ? ' (поддержка)' : ''} • ${new Date(m.created_at).toLocaleTimeString('ru-RU', {hour: '2-digit', minute: '2-digit'})}</div>
                    </div>
                `).join('');
                const chatDiv = document.getElementById('chatMessages');
                chatDiv.scrollTop = chatDiv.scrollHeight;
            });
        }

        function sendMessage() {
            const message = document.getElementById('chatInput').value;
            if (!message) return;

            apiCall(`/tickets/${currentTicketId}/messages`, 'POST', { message }).then(data => {
                if (data.success) {
                    document.getElementById('chatInput').value = '';
                    loadTicketMessages();
                }
            });
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function viewService(serviceId) {
            apiCall(`/services/${serviceId}`).then(service => {
                const modal = document.createElement('div');
                modal.className = 'modal active';
                modal.id = 'serviceDetailsModal';
                modal.innerHTML = `
                    <div class="modal-content">
                        <div class="modal-header">
                            <h2>${service.name}</h2>
                            <button class="modal-close" onclick="document.getElementById('serviceDetailsModal').remove()">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;">
                                <div>
                                    <div style="color: #94a3b8; font-size: 12px;">Тип</div>
                                    <div style="font-weight: 600; margin-top: 4px;">${service.service_type}</div>
                                </div>
                                <div>
                                    <div style="color: #94a3b8; font-size: 12px;">Статус</div>
                                    <div style="font-weight: 600; margin-top: 4px;">${getStatusText(service.status)}</div>
                                </div>
                                <div>
                                    <div style="color: #94a3b8; font-size: 12px;">CPU</div>
                                    <div style="font-weight: 600; margin-top: 4px;">${service.cpu}</div>
                                </div>
                                <div>
                                    <div style="color: #94a3b8; font-size: 12px;">RAM</div>
                                    <div style="font-weight: 600; margin-top: 4px;">${service.ram}</div>
                                </div>
                                <div>
                                    <div style="color: #94a3b8; font-size: 12px;">Диск</div>
                                    <div style="font-weight: 600; margin-top: 4px;">${service.disk}</div>
                                </div>
                                <div>
                                    <div style="color: #94a3b8; font-size: 12px;">Цена</div>
                                    <div style="font-weight: 600; margin-top: 4px;">${service.price}</div>
                                </div>
                            </div>
                            ${service.ip ? `<div style="background: rgba(34, 197, 94, 0.1); padding: 12px; border-radius: 8px; margin-bottom: 16px;">
                                <div style="color: #94a3b8; font-size: 12px;">IP адрес</div>
                                <div style="font-weight: 600; color: #86efac; margin-top: 4px; font-family: monospace;">${service.ip}</div>
                                ${service.login ? `<div style="color: #94a3b8; font-size: 12px; margin-top: 8px;">Логин</div>
                                <div style="font-weight: 600; color: #cbd5e1; margin-top: 4px; font-family: monospace;">${service.login}</div>` : ''}
                            </div>` : ''}
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-ghost" onclick="document.getElementById('serviceDetailsModal').remove()">Закрыть</button>
                            <button class="btn btn-danger" onclick="deleteService(${service.id})">Удалить</button>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            });
        }

        function deleteService(serviceId) {
            if (!confirm('Удалить услугу?')) return;
            apiCall(`/services/${serviceId}`, 'DELETE').then(data => {
                if (data.success) {
                    alert('Услуга удалена');
                    document.getElementById('serviceDetailsModal').remove();
                    renderServices();
                }
            });
        }

        function createQuickService(type, plan) {
            const price = type === 'VPS' ? '€2.97' : '€10.00';
            apiCall('/services', 'POST', {
                service_type: type,
                plan: plan,
                cpu: '2vCPU',
                ram: '2GB',
                disk: '40GB SSD',
                region: 'Germany',
                os: 'Ubuntu 22.04',
                price: price,
                setup_fee: '€0',
                datacenter: '🇩🇪'
            }).then(data => {
                if (data.success) {
                    alert('Услуга заказана! Ожидание активации администратором');
                    closeModal('serviceModal');
                    updateBalance();
                    renderServices();
                }
            });
        }

        // Initial load
        renderDashboard();
        setInterval(updateBalance, 30000);

        // Keyboard shortcuts
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal.active').forEach(m => m.classList.remove('active'));
                document.getElementById('newTicketModal')?.remove();
                document.getElementById('serviceDetailsModal')?.remove();
            }
        });

        // Close modal on background click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', e => {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
    </script>
</body>
</html>
