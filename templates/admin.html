{% extends "base.html" %}
{% block content %}
<div class="container-fluid" style="position: relative; z-index: 1;">
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-custom m-3 px-4 py-3">
        <div class="container-fluid">
            <span class="navbar-brand fs-4 fw-bold">
                <i class="fas fa-user-shield me-2"></i>Админ панель
            </span>
            <a href="/" class="btn btn-glass btn-sm">
                <i class="fas fa-arrow-left me-1"></i>На главную
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="p-3">
        <!-- Services Section -->
        <div class="glass p-4 mb-4">
            <h4 class="text-white mb-4"><i class="fas fa-server me-2"></i>Услуги</h4>
            <div class="table-responsive">
                <table class="table table-dark table-hover" id="servicesTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Владелец</th>
                            <th>Тип</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <!-- Tickets Section -->
        <div class="glass p-4 mb-4">
            <h4 class="text-white mb-4"><i class="fas fa-ticket-alt me-2"></i>Тикеты</h4>
            <div id="ticketsDiv" class="row g-3"></div>
        </div>

        <!-- CDN Requests Section -->
        <div class="glass p-4">
            <h4 class="text-white mb-4"><i class="fas fa-network-wired me-2"></i>CDN запросы</h4>
            <div class="table-responsive">
                <table class="table table-dark table-hover" id="cdnTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Сайт</th>
                            <th>Статус</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Modals Container -->
<div id="modalsContainer"></div>

{% endblock %}

{% block scripts %}
<script>
let currentTicketId;

// Load data on page load
document.addEventListener('DOMContentLoaded', () => {
    loadData();
    setInterval(loadData, 30000); // Refresh every 30 seconds
});

async function loadData() {
    await Promise.all([
        loadServices(),
        loadTickets(),
        loadCDNRequests()
    ]);
}

async function loadServices() {
    const res = await fetch('/api/admin/services');
    const services = await res.json();

    const tbody = document.querySelector('#servicesTable tbody');
    tbody.innerHTML = services.map(s => `
        <tr>
            <td>${s.id}</td>
            <td>${s.name}</td>
            <td>${s.owner_username}</td>
            <td><span class="badge bg-primary">${s.service_type}</span></td>
            <td><span class="status-${s.status}">${getStatus(s.status)}</span></td>
            <td>
                ${s.status === 'pending' ? `
                    <button class="btn btn-sm btn-success" onclick="openActivate(${s.id}, '${s.service_type}')">
                        <i class="fas fa-check me-1"></i>Активировать
                    </button>
                ` : ''}
                ${s.status === 'expired' || s.status === 'expiring_soon' ? `
                    <button class="btn btn-sm btn-info" onclick="renewService(${s.id})">
                        <i class="fas fa-redo me-1"></i>Продлить
                    </button>
                ` : ''}
            </td>
        </tr>
    `).join('');
}

async function loadTickets() {
    const res = await fetch('/api/admin/tickets');
    const tickets = await res.json();

    const div = document.getElementById('ticketsDiv');
    div.innerHTML = tickets.map(t => `
        <div class="col-md-6">
            <div class="card glass-dark" style="cursor: pointer;" onclick="openTicket(${t.id}, '${t.subject}')">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="text-white mb-0">${t.subject}</h6>
                        <span class="badge ${t.status === 'open' ? 'bg-success' : 'bg-secondary'}">${t.status}</span>
                    </div>
                    <div class="d-flex gap-2 mb-2">
                        <span class="badge priority-${t.priority}">${t.priority}</span>
                        <span class="badge category-${t.category}">${t.category}</span>
                    </div>
                    <small class="text-white-50">От: ${t.username}</small>
                </div>
            </div>
        </div>
    `).join('');
}

async function loadCDNRequests() {
    const res = await fetch('/api/admin/cdn-requests');
    const reqs = await res.json();

    const tbody = document.querySelector('#cdnTable tbody');
    tbody.innerHTML = reqs.map(r => `
        <tr>
            <td>${r.id}</td>
            <td>${r.first_name} ${r.last_name}</td>
            <td>${r.email}</td>
            <td>${r.website_url}</td>
            <td><span class="badge ${r.status === 'pending' ? 'bg-warning' : 'bg-success'}">${r.status}</span></td>
            <td>
                ${r.status === 'pending' ? `
                    <button class="btn btn-sm btn-success" onclick="activateCDN(${r.id})">
                        <i class="fas fa-check me-1"></i>Активировать
                    </button>
                ` : ''}
            </td>
        </tr>
    `).join('');
}

function getStatus(s) {
    const map = {
        'pending': 'Активация',
        'active': 'Активна',
        'expiring_soon': 'Истекает',
        'expired': 'Истекла'
    };
    return map[s] || s;
}

function openActivate(id, type) {
    let fields = '';
    if (type === 'VPS' || type === 'DEDICATED') {
        fields = `
            <div class="mb-3">
                <label class="form-label text-white">IP адрес</label>
                <input type="text" class="form-control" id="actIP" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Login</label>
                <input type="text" class="form-control" id="actLogin" value="root" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Пароль</label>
                <input type="text" class="form-control" id="actPass" required>
            </div>
        `;
    } else if (type === 'VPN') {
        fields = `
            <div class="mb-3">
                <label class="form-label text-white">VPN ключ/конфиг</label>
                <textarea class="form-control" id="actVPNKey" rows="6" required></textarea>
            </div>
        `;
    } else if (type === 'S3') {
        fields = `
            <div class="mb-3">
                <label class="form-label text-white">S3 Endpoint</label>
                <input type="text" class="form-control" id="actS3Endpoint" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Access Key</label>
                <input type="text" class="form-control" id="actS3Access" required>
            </div>
            <div class="mb-3">
                <label class="form-label text-white">Secret Key</label>
                <input type="text" class="form-control" id="actS3Secret" required>
            </div>
        `;
    }

    const html = `
        <div class="modal fade" id="activateModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Активация услуги #${id}</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="activateForm">
                            ${fields}
                            <button type="submit" class="btn btn-gradient w-100">Активировать</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    `;

    document.getElementById('modalsContainer').innerHTML = html;
    const modal = new bootstrap.Modal(document.getElementById('activateModal'));
    modal.show();

    document.getElementById('activateForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {};

        if (document.getElementById('actIP')) {
            data.ip = document.getElementById('actIP').value;
            data.login = document.getElementById('actLogin').value;
            data.password = document.getElementById('actPass').value;
        }
        if (document.getElementById('actVPNKey')) {
            data.vpn_key = document.getElementById('actVPNKey').value;
        }
        if (document.getElementById('actS3Endpoint')) {
            data.s3_endpoint = document.getElementById('actS3Endpoint').value;
            data.s3_access_key = document.getElementById('actS3Access').value;
            data.s3_secret_key = document.getElementById('actS3Secret').value;
        }

        const res = await fetch(`/api/admin/services/${id}/activate`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        if (res.ok) {
            modal.hide();
            showToast('Успех', 'Услуга активирована', 'success');
            loadData();
        }
    };
}

async function renewService(id) {
    if (!confirm('Продлить услугу на 30 дней?')) return;

    const res = await fetch(`/api/admin/services/${id}/renew`, { method: 'POST' });
    if (res.ok) {
        showToast('Успех', 'Услуга продлена', 'success');
        loadData();
    }
}

function openTicket(id, subject) {
    currentTicketId = id;

    const html = `
        <div class="modal fade" id="ticketModal" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">${subject}</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="ticketMessages" class="mb-3" style="max-height: 400px; overflow-y: auto;"></div>
                        <form id="ticketReplyForm">
                            <div class="input-group">
                                <input type="text" class="form-control" id="ticketReply" placeholder="Ваш ответ..." required>
                                <button type="submit" class="btn btn-gradient">
                                    <i class="fas fa-paper-plane"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    `;

    document.getElementById('modalsContainer').innerHTML = html;
    const modal = new bootstrap.Modal(document.getElementById('ticketModal'));
    modal.show();

    loadTicketMessages(id);

    document.getElementById('ticketReplyForm').onsubmit = async (e) => {
        e.preventDefault();
        const message = document.getElementById('ticketReply').value;

        const res = await fetch(`/api/admin/tickets/${id}/messages`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message })
        });

        if (res.ok) {
            document.getElementById('ticketReply').value = '';
            loadTicketMessages(id);
        }
    };
}

async function loadTicketMessages(ticketId) {
    const res = await fetch(`/api/admin/tickets/${ticketId}/messages`);
    const messages = await res.json();

    const div = document.getElementById('ticketMessages');
    div.innerHTML = messages.map(m => `
        <div class="mb-2 ${m.sender_type === 'admin' ? 'text-end' : ''}">
            <div class="d-inline-block p-3 rounded ${m.sender_type === 'admin' ? 'bg-primary' : 'bg-secondary'} text-white" style="max-width: 70%;">
                <div class="fw-bold small">${m.sender_type === 'admin' ? 'Вы' : m.sender}</div>
                <div>${m.message}</div>
                <div class="small opacity-75 mt-1">${formatDate(m.created_at)}</div>
            </div>
        </div>
    `).join('');

    div.scrollTop = div.scrollHeight;
}

async function activateCDN(id) {
    if (!confirm('Активировать CDN запрос? Будет создан тикет для связи с клиентом.')) return;

    const res = await fetch(`/api/admin/cdn-requests/${id}/activate`, { method: 'POST' });
    if (res.ok) {
        showToast('Успех', 'CDN активирован, тикет создан', 'success');
        loadData();
    }
}
</script>
{% endblock %}
