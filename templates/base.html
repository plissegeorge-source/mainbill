<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MainBill{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --glass: rgba(255, 255, 255, 0.06);
            --border: rgba(255, 255, 255, 0.08);
            --accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        body {
            background: radial-gradient(circle at 10% 20%, #1d253c, #0f172a 35%), radial-gradient(circle at 90% 10%, #111827, #0f172a 30%), radial-gradient(circle at 80% 80%, #0b132b, #0f172a 40%);
            color: #e5e7eb;
            min-height: 100vh;
        }
        .glass {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }
        .nav-chip {
            border-radius: 999px;
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: rgba(255, 255, 255, 0.05);
            color: #e5e7eb;
            transition: all 0.2s ease;
        }
        .nav-chip:hover,
        .nav-chip.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
        }
        .service-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }
        .service-card:hover { transform: translateY(-4px); box-shadow: 0 15px 40px rgba(0,0,0,0.35); }
        .status-badge { padding: 6px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
        .status-pending { background: #fef3c7; color: #92400e; }
        .status-active { background: #d1fae5; color: #065f46; }
        .status-expiring_soon { background: #fed7aa; color: #9a3412; }
        .status-expired { background: #fee2e2; color: #991b1b; }
        .chat-bubble { border-radius: 16px; padding: 12px 14px; }
        .chat-bubble.user { background: #111827; border: 1px solid var(--border); }
        .chat-bubble.admin { background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.4); }
        .scroll-area { max-height: 420px; overflow-y: auto; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="pb-5">
    {% block content %}{% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
