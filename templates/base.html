<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cloud Hosting{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); border-radius: 16px; }
        .service-card { transition: transform 0.2s; cursor: pointer; }
        .service-card:hover { transform: translateY(-4px); }
        .status-pending { background: #FEF3C7; color: #92400E; }
        .status-active { background: #D1FAE5; color: #065F46; }
        .status-expiring_soon { background: #FED7AA; color: #9A3412; }
        .status-expired { background: #FEE2E2; color: #991B1B; }

        .selectable { cursor: pointer !important; transition: all 0.2s !important; }
        .selectable:hover { transform: scale(1.02) !important; opacity: 0.9 !important; }
        .selectable.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            border-color: #667eea !important;
            box-shadow: 0 0 20px rgba(102,126,234,0.6) !important;
            transform: scale(1.05) !important;
        }

        .payment-method {
            padding: 20px;
            border: 3px solid #dee2e6;
            border-radius: 12px;
            text-align: center;
            background: white;
            transition: all 0.3s;
        }
        .payment-method:hover {
            border-color: #667eea !important;
            transform: translateY(-5px) !important;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2) !important;
        }
        .payment-method.selected {
            border-color: #667eea !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            box-shadow: 0 0 25px rgba(102,126,234,0.7) !important;
            transform: scale(1.1) !important;
        }

        .btn-group .selectable.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            border-color: #667eea !important;
        }

        #planList .card.selected,
        #osList .card.selected,
        #s3Types .card.selected,
        #vdesktopOS .card.selected,
        #vdesktopPlans .card.selected {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            color: white !important;
            border: 3px solid #667eea !important;
            box-shadow: 0 0 20px rgba(102,126,234,0.6) !important;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
