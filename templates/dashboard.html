{% extends "base.html" %}
{% block content %}
<div class="container-fluid" style="position: relative; z-index: 1;">
    <!-- Navbar -->
    <nav class="navbar navbar-dark navbar-custom m-3 px-4 py-3">
        <div class="container-fluid">
            <span class="navbar-brand fs-4 fw-bold">
                <i class="fas fa-cloud me-2"></i>Cloud Hosting Pro
            </span>
            <div class="d-flex gap-3 flex-wrap align-items-center">
                <!-- Balance -->
                <div class="glass px-4 py-2" style="border-radius: 50px;">
                    <i class="fas fa-wallet me-2"></i>
                    <span class="fw-bold" id="balance">€0.00</span>
                </div>
                <!-- Top Up -->
                <button class="btn btn-gradient btn-sm" onclick="openTopUpModal()">
                    <i class="fas fa-plus me-1"></i>Пополнить
                </button>
                <!-- Notifications -->
                <div class="position-relative">
                    <button class="btn btn-glass btn-sm" onclick="loadNotifications()" data-bs-toggle="dropdown">
                        <i class="fas fa-bell"></i>
                        <span class="notification-badge" id="notifBadge" style="display: none;">0</span>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end glass-dark p-3" style="width: 350px; max-height: 400px; overflow-y: auto;" id="notificationsList">
                        <p class="text-center text-white-50">Нет уведомлений</p>
                    </div>
                </div>
                <!-- Menu -->
                <div class="dropdown">
                    <button class="btn btn-glass btn-sm dropdown-toggle" data-bs-toggle="dropdown">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="dropdown-menu dropdown-menu-end glass-dark">
                        <a class="dropdown-item text-white" href="#" onclick="loadSection('services')">
                            <i class="fas fa-server me-2"></i>Мои услуги
                        </a>
                        <a class="dropdown-item text-white" href="#" onclick="loadSection('transactions')">
                            <i class="fas fa-receipt me-2"></i>Транзакции
                        </a>
                        <a class="dropdown-item text-white" href="#" onclick="loadSection('tickets')">
                            <i class="fas fa-ticket-alt me-2"></i>Тикеты
                        </a>
                        <div class="dropdown-divider" style="border-color: rgba(255,255,255,0.1);"></div>
                        <a class="dropdown-item text-white" href="#" onclick="loadSection('vps')">
                            <i class="fas fa-desktop me-2"></i>Заказать VPS
                        </a>
                        <a class="dropdown-item text-white" href="#" onclick="loadSection('dedicated')">
                            <i class="fas fa-hdd me-2"></i>Заказать Dedicated
                        </a>
                        <div class="dropdown-divider" style="border-color: rgba(255,255,255,0.1);"></div>
                        <a class="dropdown-item text-danger" href="/logout">
                            <i class="fas fa-sign-out-alt me-2"></i>Выход
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div id="content" class="px-3 pb-5"></div>
</div>

<!-- Live Chat Button -->
<button class="chat-button" onclick="toggleChat()" id="chatButton">
    <i class="fas fa-comments"></i>
</button>

<!-- Live Chat Window -->
<div id="chatWindow" style="display: none; position: fixed; bottom: 100px; right: 30px; width: 350px; height: 500px; z-index: 1001;">
    <div class="glass-dark h-100 d-flex flex-column" style="border-radius: 20px;">
        <div class="p-3 border-bottom" style="border-color: rgba(255,255,255,0.1) !important;">
            <div class="d-flex justify-content-between align-items-center">
                <h6 class="mb-0 text-white"><i class="fas fa-comments me-2"></i>Чат с поддержкой</h6>
                <button class="btn btn-sm btn-glass" onclick="toggleChat()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div id="chatMessages" class="flex-grow-1 p-3" style="overflow-y: auto; max-height: 380px;"></div>
        <div class="p-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
            <div class="input-group">
                <input type="text" class="form-control" id="chatInput" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter')sendChatMessage()">
                <button class="btn btn-gradient" onclick="sendChatMessage()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modals will be added dynamically -->
<div id="modalsContainer"></div>

{% endblock %}

{% block scripts %}
<script>
let config, chatSocket, currentSection = 'services';

// Initialize
document.addEventListener('DOMContentLoaded', () => {
    loadConfig();
    loadBalance();
    loadNotificationsCount();
    loadSection('services');
});

// Config
async function loadConfig() {
    const res = await fetch('/api/config');
    config = await res.json();
}

// Balance
async function loadBalance() {
    const res = await fetch('/api/balance');
    const data = await res.json();
    document.getElementById('balance').textContent = formatCurrency(data.balance);
}

// Notifications
async function loadNotificationsCount() {
    const res = await fetch('/api/notifications?unread_only=true');
    const notifs = await res.json();
    const badge = document.getElementById('notifBadge');
    if (notifs.length > 0) {
        badge.textContent = notifs.length;
        badge.style.display = 'flex';
    } else {
        badge.style.display = 'none';
    }
}

async function loadNotifications() {
    const res = await fetch('/api/notifications');
    const notifs = await res.json();
    const list = document.getElementById('notificationsList');

    if (notifs.length === 0) {
        list.innerHTML = '<p class="text-center text-white-50 mb-0">Нет уведомлений</p>';
        return;
    }

    list.innerHTML = notifs.map(n => `
        <div class="alert alert-${n.type} mb-2" style="cursor: pointer;" onclick="markNotificationRead(${n.id})">
            <div class="d-flex justify-content-between">
                <strong>${n.title}</strong>
                ${!n.is_read ? '<span class="badge bg-danger">NEW</span>' : ''}
            </div>
            <small>${n.message}</small>
            <div class="small text-muted mt-1">${formatDate(n.created_at)}</div>
        </div>
    `).join('');
}

async function markNotificationRead(id) {
    await fetch(`/api/notifications/${id}/read`, { method: 'POST' });
    loadNotifications();
    loadNotificationsCount();
}

// Sections
function loadSection(section) {
    currentSection = section;
    const content = document.getElementById('content');

    if (section === 'services') loadServices();
    else if (section === 'transactions') loadTransactions();
    else if (section === 'tickets') loadTickets();
    else if (section === 'vps' || section === 'dedicated') showOrderSection(section);
}

// Services
async function loadServices() {
    showLoading();
    const res = await fetch('/api/services');
    const services = await res.json();
    hideLoading();

    const content = document.getElementById('content');
    content.innerHTML = `
        <div class="glass p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="text-white mb-0"><i class="fas fa-server me-2"></i>Мои услуги</h3>
                <div class="btn-group">
                    <button class="btn btn-gradient btn-sm" onclick="loadSection('vps')">
                        <i class="fas fa-plus me-1"></i>VPS
                    </button>
                    <button class="btn btn-gradient btn-sm" onclick="loadSection('dedicated')">
                        <i class="fas fa-plus me-1"></i>Dedicated
                    </button>
                </div>
            </div>
            <div class="row g-4">
                ${services.length > 0 ? services.map(s => `
                    <div class="col-md-6 col-lg-4">
                        <div class="card glass-dark service-card h-100" onclick="viewService(${s.id})">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start mb-3">
                                    <h5 class="card-title text-white mb-0">${s.name}</h5>
                                    <span class="status-${s.status}">${getStatus(s.status)}</span>
                                </div>
                                <p class="text-white-50 mb-2">
                                    <i class="fas fa-server me-2"></i>${s.service_type} ${s.plan || ''}
                                </p>
                                ${s.cpu ? `<p class="text-white-50 small mb-1"><i class="fas fa-microchip me-2"></i>${s.cpu}</p>` : ''}
                                ${s.ram ? `<p class="text-white-50 small mb-1"><i class="fas fa-memory me-2"></i>${s.ram}</p>` : ''}
                                <div class="mt-3 pt-3 border-top" style="border-color: rgba(255,255,255,0.1) !important;">
                                    <div class="d-flex justify-content-between">
                                        <span class="text-white fw-bold">${s.price}</span>
                                        <span class="text-white-50 small">${s.datacenter || ''}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('') : '<div class="col-12"><p class="text-white text-center">Нет услуг</p></div>'}
            </div>
        </div>
    `;
}

function getStatus(status) {
    const map = {
        'pending': 'Активация',
        'active': 'Активна',
        'expiring_soon': 'Истекает',
        'expired': 'Истекла'
    };
    return map[status] || status;
}

// Transactions
async function loadTransactions() {
    showLoading();
    const res = await fetch('/api/transactions');
    const transactions = await res.json();
    hideLoading();

    const content = document.getElementById('content');
    content.innerHTML = `
        <div class="glass p-4">
            <h3 class="text-white mb-4"><i class="fas fa-receipt me-2"></i>История транзакций</h3>
            <div class="table-responsive">
                <table class="table table-dark table-hover">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Описание</th>
                            <th class="text-end">Сумма</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${transactions.map(t => `
                            <tr>
                                <td>${formatDate(t.created_at)}</td>
                                <td>${t.description}</td>
                                <td class="text-end ${t.amount > 0 ? 'text-success' : 'text-danger'}">
                                    ${t.amount > 0 ? '+' : ''}${formatCurrency(t.amount)}
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

// Tickets
async function loadTickets() {
    showLoading();
    const res = await fetch('/api/tickets');
    const tickets = await res.json();
    hideLoading();

    const content = document.getElementById('content');
    content.innerHTML = `
        <div class="glass p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="text-white mb-0"><i class="fas fa-ticket-alt me-2"></i>Тикеты</h3>
                <button class="btn btn-gradient" onclick="showCreateTicket()">
                    <i class="fas fa-plus me-1"></i>Создать тикет
                </button>
            </div>
            <div class="row g-3">
                ${tickets.map(t => `
                    <div class="col-12">
                        <div class="card glass-dark" style="cursor: pointer;" onclick="openTicket(${t.id})">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-start">
                                    <div>
                                        <h6 class="text-white mb-2">${t.subject}</h6>
                                        <div class="d-flex gap-2">
                                            <span class="badge priority-${t.priority}">${t.priority.toUpperCase()}</span>
                                            <span class="badge category-${t.category}">${t.category}</span>
                                            <span class="badge ${t.status === 'open' ? 'bg-success' : 'bg-secondary'}">${t.status}</span>
                                        </div>
                                    </div>
                                    <small class="text-white-50">${formatDate(t.created_at)}</small>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('')}
            </div>
        </div>
    `;
}

function showCreateTicket() {
    const html = `
        <div class="modal fade" id="createTicketModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Создать тикет</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="ticketForm">
                            <div class="mb-3">
                                <label class="form-label text-white">Категория</label>
                                <select class="form-select" id="ticketCategory">
                                    <option value="general">Общий вопрос</option>
                                    <option value="technical">Техническая проблема</option>
                                    <option value="billing">Биллинг</option>
                                    <option value="sales">Продажи</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Приоритет</label>
                                <select class="form-select" id="ticketPriority">
                                    <option value="low">Низкий</option>
                                    <option value="medium" selected>Средний</option>
                                    <option value="high">Высокий</option>
                                    <option value="urgent">Срочный</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Тема</label>
                                <input type="text" class="form-control" id="ticketSubject" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white">Сообщение</label>
                                <textarea class="form-control" id="ticketMessage" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-gradient w-100">Создать</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('modalsContainer').innerHTML = html;
    const modal = new bootstrap.Modal(document.getElementById('createTicketModal'));
    modal.show();

    document.getElementById('ticketForm').onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/tickets', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                category: document.getElementById('ticketCategory').value,
                priority: document.getElementById('ticketPriority').value,
                subject: document.getElementById('ticketSubject').value,
                message: document.getElementById('ticketMessage').value
            })
        });
        if (res.ok) {
            modal.hide();
            showToast('Успех', 'Тикет создан', 'success');
            loadTickets();
        }
    };
}

// Top Up Modal
function openTopUpModal() {
    const html = `
        <div class="modal fade" id="topUpModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Пополнить баланс</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label text-white">Сумма</label>
                            <div class="btn-group w-100 mb-2">
                                <button class="btn btn-glass" onclick="document.getElementById('topUpAmount').value=10">€10</button>
                                <button class="btn btn-glass" onclick="document.getElementById('topUpAmount').value=25">€25</button>
                                <button class="btn btn-glass" onclick="document.getElementById('topUpAmount').value=50">€50</button>
                                <button class="btn btn-glass" onclick="document.getElementById('topUpAmount').value=100">€100</button>
                            </div>
                            <input type="number" class="form-control" id="topUpAmount" min="1" placeholder="Или введите сумму">
                        </div>
                        <div class="alert alert-info">
                            <small>Демо режим: пополнение происходит автоматически</small>
                        </div>
                        <button class="btn btn-gradient w-100" onclick="submitTopUp()">Пополнить</button>
                    </div>
                </div>
            </div>
        </div>
    `;
    document.getElementById('modalsContainer').innerHTML = html;
    const modal = new bootstrap.Modal(document.getElementById('topUpModal'));
    modal.show();
}

async function submitTopUp() {
    const amount = parseFloat(document.getElementById('topUpAmount').value);
    if (!amount || amount <= 0) {
        showToast('Ошибка', 'Введите сумму', 'error');
        return;
    }
    const res = await fetch('/api/balance/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount })
    });
    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('topUpModal')).hide();
        showToast('Успех', `Баланс пополнен на €${amount.toFixed(2)}`, 'success');
        loadBalance();
        loadNotificationsCount();
    }
}

// Live Chat
function toggleChat() {
    const chatWindow = document.getElementById('chatWindow');
    const chatButton = document.getElementById('chatButton');

    if (chatWindow.style.display === 'none') {
        chatWindow.style.display = 'block';
        chatButton.innerHTML = '<i class="fas fa-times"></i>';
        if (!chatSocket) initChat();
    } else {
        chatWindow.style.display = 'none';
        chatButton.innerHTML = '<i class="fas fa-comments"></i>';
    }
}

function initChat() {
    // WebSocket connection would go here
    // For demo, show welcome message
    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML = `
        <div class="text-center text-white-50 mb-3">
            <i class="fas fa-comments fa-3x mb-2"></i>
            <p>Здравствуйте! Чем могу помочь?</p>
        </div>
    `;
}

function sendChatMessage() {
    const input = document.getElementById('chatInput');
    const message = input.value.trim();
    if (!message) return;

    const chatMessages = document.getElementById('chatMessages');
    chatMessages.innerHTML += `
        <div class="mb-2 text-end">
            <div class="d-inline-block p-2 rounded" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); max-width: 80%;">
                ${message}
            </div>
        </div>
    `;
    input.value = '';
    chatMessages.scrollTop = chatMessages.scrollHeight;

    // Simulate admin response
    setTimeout(() => {
        chatMessages.innerHTML += `
            <div class="mb-2">
                <div class="d-inline-block p-2 rounded bg-secondary text-white" style="max-width: 80%;">
                    Спасибо за сообщение! Оператор скоро ответит.
                </div>
            </div>
        `;
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }, 1000);
}

// Order sections (simplified)
function showOrderSection(type) {
    const content = document.getElementById('content');
    content.innerHTML = `
        <div class="glass p-4">
            <h3 class="text-white mb-4">Заказать ${type.toUpperCase()}</h3>
            <p class="text-white-50">Функционал заказа будет доступен в полной версии.</p>
            <button class="btn btn-gradient" onclick="loadSection('services')">Вернуться к услугам</button>
        </div>
    `;
}

function viewService(id) {
    // Service details modal
    showToast('Info', 'Просмотр деталей услуги #' + id, 'info');
}
</script>
{% endblock %}
