{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="glass p-5 text-white">
                <div class="text-center mb-4">
                    <i class="fas fa-cloud fa-4x mb-3" style="background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                    <h1 class="fw-bold">Cloud Hosting Pro</h1>
                    <p class="opacity-75">{{ 'Регистрация' if mode == 'register' else 'Вход в систему' }}</p>
                </div>

                {% if error %}
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Имя пользователя</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: white;">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" name="username" class="form-control" placeholder="Введите имя пользователя" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <div class="input-group">
                            <span class="input-group-text" style="background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: white;">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" name="password" class="form-control" placeholder="Введите пароль" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 py-3 fw-bold">
                        {{ 'Зарегистрироваться' if mode == 'register' else 'Войти' }}
                    </button>
                </form>

                <div class="text-center mt-4">
                    {% if mode == 'register' %}
                    <p class="text-white-50">
                        Уже есть аккаунт? <a href="/login" class="text-white fw-bold">Войти</a>
                    </p>
                    {% else %}
                    <p class="text-white-50">
                        Нет аккаунта? <a href="/register" class="text-white fw-bold">Регистрация</a>
                    </p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
