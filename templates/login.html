<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Hosting Pro - Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e2e8f0;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }
        .auth-box {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.8) 100%);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 16px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .logo i { font-size: 36px; }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 10px;
            color: #f1f5f9;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: 500;
            font-size: 14px;
        }
        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 12px 14px;
            background: rgba(100, 116, 139, 0.1);
            border: 1px solid rgba(100, 116, 139, 0.3);
            border-radius: 8px;
            color: #e2e8f0;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #06b6d4;
            background: rgba(100, 116, 139, 0.15);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1);
        }
        .btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(6, 182, 212, 0.3);
        }
        .btn:active {
            transform: translateY(0);
        }
        .toggle-auth {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 13px;
        }
        .toggle-auth a {
            color: #06b6d4;
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        .toggle-auth a:hover {
            color: #3b82f6;
        }
        .error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ff7b7b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            display: none;
        }
        .error.show { display: block; }
        .demo-accounts {
            background: rgba(100, 116, 139, 0.1);
            border: 1px solid rgba(100, 116, 139, 0.2);
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 12px;
        }
        .demo-accounts h4 {
            margin-bottom: 8px;
            color: #cbd5e1;
        }
        .demo-account {
            padding: 8px;
            margin-bottom: 6px;
            background: rgba(100, 116, 139, 0.2);
            border-radius: 6px;
        }
        .demo-account code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            color: #cbd5e1;
        }
        .form-hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-box">
            <div class="logo">
                <i class="fas fa-cloud"></i>
                <span>Cloud Pro</span>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <h1>Вход</h1>
                <p class="subtitle">Управляйте своими облачными сервисами</p>

                <div class="error" id="errorMsg"></div>

                <div class="form-group">
                    <label for="loginUsername">Имя пользователя</label>
                    <input type="text" id="loginUsername" placeholder="admin">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" placeholder="••••••••">
                </div>

                <button class="btn" onclick="handleLogin()">Войти</button>

                <div class="toggle-auth">
                    Нет аккаунта? <a onclick="toggleForms()">Создайте его</a>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="form-hidden">
                <h1>Создайте аккаунт</h1>
                <p class="subtitle">Или используйте демо учётные данные</p>

                <div class="error" id="errorMsgReg"></div>

                <div class="form-group">
                    <label for="regUsername">Имя пользователя</label>
                    <input type="text" id="regUsername" placeholder="your-username">
                </div>

                <div class="form-group">
                    <label for="regPassword">Пароль</label>
                    <input type="password" id="regPassword" placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="regPassword2">Подтверждение пароля</label>
                    <input type="password" id="regPassword2" placeholder="••••••••">
                </div>

                <button class="btn" onclick="handleRegister()">Создать аккаунт</button>

                <div class="toggle-auth">
                    Уже есть аккаунт? <a onclick="toggleForms()">Войти</a>
                </div>
            </div>

            <!-- Demo Accounts -->
            <div class="demo-accounts">
                <h4>📋 Демо учётные данные:</h4>
                <div class="demo-account">
                    <code>admin</code> / <code>admin</code> (администратор)
                </div>
                <div class="demo-account">
                    <code>testuser</code> / <code>testpassword</code> (пользователь)
                </div>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:8000/api';

        function toggleForms() {
            document.getElementById('loginForm').classList.toggle('form-hidden');
            document.getElementById('registerForm').classList.toggle('form-hidden');
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('errorMsgReg').classList.remove('show');
        }

        function showError(msg, isRegister = false) {
            const errorEl = isRegister ? document.getElementById('errorMsgReg') : document.getElementById('errorMsg');
            errorEl.textContent = msg;
            errorEl.classList.add('show');
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) {
                showError('Заполните все поля');
                return;
            }

            try {
                const response = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.detail || 'Неверные учётные данные');
                    return;
                }

                localStorage.setItem('authToken', data.token);
                window.location.href = '/';
            } catch (err) {
                showError('Ошибка подключения');
            }
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const password2 = document.getElementById('regPassword2').value;

            if (!username || !password) {
                showError('Заполните все поля', true);
                return;
            }

            if (password !== password2) {
                showError('Пароли не совпадают', true);
                return;
            }

            if (password.length < 6) {
                showError('Пароль должен быть минимум 6 символов', true);
                return;
            }

            try {
                const response = await fetch(`${API}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.detail || 'Ошибка регистрации', true);
                    return;
                }

                localStorage.setItem('authToken', data.token);
                window.location.href = '/';
            } catch (err) {
                showError('Ошибка подключения', true);
            }
        }

        // Enter key support
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginForm').classList.contains('form-hidden')) {
                    handleLogin();
                } else {
                    handleRegister();
                }
            }
        });
    </script>
</body>
</html>
