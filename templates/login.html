{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-5">
            <div class="glass p-5 text-white">
                <div class="text-center mb-4">
                    <i class="fas fa-cloud fa-4x mb-3"></i>
                    <h1>Cloud Hosting</h1>
                    <p class="opacity-75">{{ 'Регистрация' if mode == 'register' else 'Вход в систему' }}</p>
                </div>
                
                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}
                
                <form method="POST">
                    <div class="mb-3">
                        <input type="text" name="username" class="form-control" placeholder="Имя пользователя" required>
                    </div>
                    <div class="mb-3">
                        <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                    </div>
                    <button type="submit" class="btn btn-light w-100 fw-bold">
                        {{ 'Зарегистрироваться' if mode == 'register' else 'Войти' }}
                    </button>
                </form>
                
                <div class="text-center mt-3">
                    {% if mode == 'register' %}
                    <a href="/login" class="text-white">Уже есть аккаунт? Войти</a>
                    {% else %}
                    <a href="/register" class="text-white">Нет аккаунта? Регистрация</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
